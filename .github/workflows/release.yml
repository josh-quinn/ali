name: release

# Publishes a release when a version tag (v1.2.3) is pushed. See RELEASING.md
# and ADR 0042.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    permissions:
      contents: write     # create the GitHub Release and upload assets
      id-token: write     # sign build provenance with Sigstore
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
          persist-credentials: false
      - name: Only release commits that are on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install zsh (the end-to-end tests drive a real zsh)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Tests
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional; without it the Homebrew cask is skipped (see .goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Hashes of the published files (for SLSA provenance)
        id: hashes
        run: |
          cd dist
          echo "hashes=$(sha256sum -- *.tar.gz checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  # SLSA level 3 provenance, signed and uploaded to the release as
  # ali.intoto.jsonl. The generator must be referenced by tag (not SHA) so its
  # identity can be verified; OpenSSF Scorecard exempts it from pinning.
  provenance:
    needs: [release]
    permissions:
      actions: read   # read the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      provenance-name: ali.intoto.jsonl
