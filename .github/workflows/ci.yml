name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository (ADR 0026).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        go: ["1.24.x", "stable"] # the go.mod minimum and the latest release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install zsh (the end-to-end tests drive a real zsh)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install gitleaks (so the pre-push hook tests run instead of skipping)
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Tests (unit and end-to-end, race detector, coverage)
        run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          echo "### Coverage (${{ matrix.os }}, go ${{ matrix.go }})" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint (golangci-lint incl. gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every commit, not just the tip: history is published too
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan every commit for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --log-opts="--all" --redact --no-banner -v .

  fuzz:
    name: fuzz (short run of every target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each target for 20 seconds
        run: make fuzz FUZZTIME=20s

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # scan against the newest standard library
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release-config:
    name: docs and release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # tools such as actionlint need a newer Go than the go.mod minimum
      - name: Man pages generate
        run: make man && test -s man/ali.1 && find man -type f -name 'ali*' | wc -l
      - name: Lint the git hooks (shellcheck)
        run: shellcheck .githooks/pre-push
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: check
      - name: Lint the workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
