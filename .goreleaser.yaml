version: 2
project_name: ali
before:
  hooks:
    - go mod tidy
    - go run ./internal/tools/gendocs -out man -version {{ .Version }}
builds:
  - main: ./cmd/ali
    binary: ali
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - man/*
release:
  github:
    owner: josh-quinn
    name: ali
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
homebrew_casks:
  - name: ali
    repository:
      owner: josh-quinn
      name: homebrew-tap
    homepage: https://github.com/josh-quinn/ali
    description: Create, find and organise shell aliases without touching .zshrc
    license: MIT
    binaries: [ali]
    manpages:
      - man/*.1
      - man/*.7
    hooks:
      post:
        # The binary is not notarized; clear the download quarantine so macOS
        # lets it run (see goreleaser.com/customization/homebrew_casks).
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ali"]
          end
