version: 2
project_name: ali
before:
  hooks:
    - go mod tidy
    - go run ./internal/tools/gendocs -out man -version {{ .Version }}
builds:
  - main: ./cmd/ali
    binary: ali
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - man/*
release:
  github:
    owner: josh-quinn
    name: ali
checksum:
  name_template: checksums.txt
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Build, CI and tests
      regexp: '^.*?(build|ci|test|refactor|chore)(\(.+\))??!?:.+$'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - "^Merge "
homebrew_casks:
  - name: ali
    repository:
      owner: josh-quinn
      name: homebrew-tap
      # A fine-grained token with write access to the tap repository only: the
      # release workflow's own GITHUB_TOKEN cannot push to another repository.
      # (index yields "" when the variable is unset; GoReleaser has no envOrDefault)
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    # Without that token, publish the release but skip the cask instead of failing.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/josh-quinn/ali
    description: Create, find and organise shell aliases without touching .zshrc
    license: MIT
    binaries: [ali]
    manpages:
      - man/*.1
      - man/*.7
    hooks:
      post:
        # The binary is not notarized; clear the download quarantine so macOS
        # lets it run (see goreleaser.com/customization/homebrew_casks).
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ali"]
          end
